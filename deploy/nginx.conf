# Для серверов, где уже стоит nginx (вместо Caddy).
# 1) Замените game.example.com на свой домен, а 8088 — на PORT из .env.
# 2) sudo cp deploy/nginx.conf /etc/nginx/sites-available/gomoku
#    sudo ln -s /etc/nginx/sites-available/gomoku /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# 3) HTTPS: sudo apt install -y certbot python3-certbot-nginx
#           sudo certbot --nginx -d game.example.com
server {
    listen 80;
    server_name game.example.com;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;     # WebSocket
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }
}
